map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 8080, not 80 — the container runs nginx as a non-root user (see
    # Dockerfile.frontend / DEP-1), which can't bind a port below 1024.
    # Mapped back to the familiar host port 3000 in docker-compose.yml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DEP-2: baseline security headers. No HSTS here — this server block is
    # plain HTTP; HSTS belongs on the HTTPS one (nginx-tls.conf.example),
    # since telling browsers to force-upgrade to a scheme this server can't
    # even serve would just break things.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # SPA routing — always serve index.html for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend — includes /api/v1/ws/... (WebSocket progress
    # updates), so Upgrade/Connection headers must be forwarded here too.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
}
